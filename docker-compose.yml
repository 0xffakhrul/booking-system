name: booking-system

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    environment:
      # the API's own plain user, so Row-Level Security applies to it (ADR-0003)
      DATABASE_URL: postgres://tempah_app:${APP_DB_PASSWORD:?add APP_DB_PASSWORD to .env}@postgres:5432/${POSTGRES_DB}
      # the admin user: runs migrations and creates tempah_app (npm run db:setup)
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ORIGIN: http://localhost:5173
      NODE_ENV: development
      PORT: 3009
      LOG_LEVEL: debug
      TRUST_PROXY: 0
    ports:
      - "127.0.0.1:3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/src:/app/api/src
      - ./api/migrations:/app/api/migrations

volumes:
  postgres-data:
