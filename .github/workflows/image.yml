name: Image

# Builds the production image on every PR and merge, scans it with Trivy, and on merges to main
# pushes it to GitHub Container Registry tagged with the commit SHA (ADR-0010).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pinned and checksummed: in March 2026 trivy-action's tags and Trivy v0.69.4 were
  # compromised. A pinned checksum means a swapped download fails instead of running.
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  image:
    name: Build, scan and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io; only used on main

    steps:
      # Actions are pinned to commit SHAs, not tags, because tags can be moved (see above).
      # Dependabot keeps the SHAs up to date (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          platforms: linux/amd64 # the Lighthouse server
          load: true # into the runner's Docker, so Trivy scans exactly what gets pushed
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy
          ./trivy --version

      - name: Scan with Trivy
        # Fails on HIGH or CRITICAL vulnerabilities that already have a fix: those are on us.
        # Unfixed ones are listed but don't block, since nothing can be done about them yet.
        run: |
          ./trivy image --no-progress --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${IMAGE}:${{ github.sha }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag "${IMAGE}:${{ github.sha }}" "${IMAGE}:main"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:main"
          echo "Pushed \`${IMAGE}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
