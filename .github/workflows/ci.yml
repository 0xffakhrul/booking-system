name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# a new push to the same PR cancels the run that's already going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-test:
    # this name is what branch protection matches as the required status check
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        # throwaway container that only lives for this job, so these aren't secrets
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # vitest.config.ts uses this instead of .env; global-setup creates and migrates the database
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/booking_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format, lint and typecheck
        run: npm run check

      - name: Tests
        run: npm test
